<script>
try {
const lines = []; function check(n, c) { lines.push((c ? "PASS" : "FAIL") + " - " + n); }
window.alert = () => {}; window.confirm = () => true;
STATE.shipClasses = []; STATE.crewmen = []; STATE.ships = []; STATE.courses = []; STATE.race = null;
App.setShipyardAddDivision("Comet");
App.addShipClass(); const cls = STATE.shipClasses[0]; cls.thrust = 6; cls.icon = "02";
App.addCrewman(); const c = STATE.crewmen[0]; c.pilot = 7; c.gunner = 7;
App.addShip(); const s = STATE.ships[0]; App.updateShip(s.id, "classId", cls.id); App.updateShip(s.id, "crewmanId", c.id);
STATE.courses.push({ id: "c1", name: "T", division: "Comet", lanes: 6, innerHexes: 40, laps: 30, legMode: "tier", flatDamage: false });
STATE._raceSetupCourse = "c1"; STATE._raceSetupShips = [s.id]; STATE._draftNpcs = [{ name: "A", aggression: 5 }, { name: "B", aggression: 5 }, { name: "C", aggression: 5 }];
App.beginRace(); App.startRaceNow(); if (STATE.race) STATE.race.asteroids = [];
const r = STATE.race;
const first = r.initiative.slice();
let same = true;
for (let k = 0; k < 40 && !r.finished; k++) {
  const nx = nextTurnParticipant(r);
  if (!nx) { App.startNextLeg(); if (!STATE.race.legState.complete) { const exp = first.filter(id => !STATE.race.participants.find(p => p.id === id).out); const got = STATE.race.legState.order.filter(id => !STATE.race.participants.find(p => p.id === id).out); same = same && JSON.stringify(got) === JSON.stringify(exp); } continue; }
  if (nx.type === "hero") { App.takeTurn(nx.id); const t = r.legState.cars[nx.id].turn; if (t && t.awaiting) App.decideAttack(nx.id, ""); }
  else { resolveTurn(r, nx, npcChoices(r, nx)); advanceRace(r); }
}
check("the initiative order is set once and is the same in every Leg", same && JSON.stringify(r.initiative) === JSON.stringify(first));
check("the order is recorded for the whole race", Array.isArray(r.initiative) && r.initiative.length === 4);
document.getElementById("testresult").textContent = lines.join("\n") + "\n\n" + (lines.every(l => l.startsWith("PASS")) ? "ALL PASS" : "SOME FAILED");
} catch (e) { document.getElementById("testresult").textContent = "THREW: " + e.message + "\n" + e.stack; }
</script></body></html>
