<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="view"></div>
<pre id="testresult">pending</pre>
<script src="file:///D:/Dropbox/Home/Games/GASCAR/webapp/version.js"></script>
<script src="file:///D:/Dropbox/Home/Games/GASCAR/webapp/data.js"></script>
<script src="file:///D:/Dropbox/Home/Games/GASCAR/webapp/app.js"></script>
<script>
try {
const lines = []; function check(n, c) { lines.push((c ? "PASS" : "FAIL") + " - " + n); }

function setup() {
  STATE.shipClasses = []; STATE.crewmen = []; STATE.ships = []; STATE.courses = []; STATE.race = null;
  App.setShipyardAddDivision("Comet"); App.addShipClass(); const cls = STATE.shipClasses[0]; cls.thrust = 3; cls.range = 3;
  App.addCrewman(); const c = STATE.crewmen[0]; c.pilot = 7; c.gunner = 5;
  App.addShip(); const sh = STATE.ships[0]; App.updateShip(sh.id, "classId", cls.id); App.updateShip(sh.id, "crewmanId", c.id);
  STATE.courses.push({ id: "c1", name: "T", division: "Comet", lanes: 6, innerHexes: 50, laps: 9, legMode: "tier", flatDamage: false });
  STATE._raceSetupCourse = "c1"; STATE._raceSetupShips = [sh.id]; STATE._draftNpcs = [];
  App.beginRace(); App.startRaceNow(); if (STATE.race) STATE.race.asteroids = [];
}

// Leg 1: a rival sits right next to the hero. No attack should be offered.
rollD = s => 1 + Math.floor(Math.random() * s);
setup();
let race = STATE.race;
let hero = race.participants[0];
const rival1 = { ...hero, id: "rv1", name: "Rival1", type: "npc", out: false, lane: hero.lane, hexPos: hero.hexPos + 1, history: [], cumulative: 0, laps: 0, gear: 0, pendingD: 0, hp: 10, maxHp: 10 };
race.participants.push(rival1);
race.legState.cars[rival1.id] = { gearChange: 0, slipsThisLeg: 0, pendingD: 0, turn: null, turnDone: true };
race.legState.order.push(rival1.id);
check("Leg 1 is legIndex 0", race.legIndex === 0);
hero.gear = 1;
App.takeTurn(hero.id);
let t = race.legState.cars[hero.id].turn;
check("no attack is offered on Leg 1 even with a racer in range", !t || !t.awaiting || t.awaiting.length === 0);

// Walk the turn to completion via straight/left clicks to make sure nothing crashes
for (let k = 0; k < 50 && t && !race.legState.cars[hero.id].turnDone; k++) {
  if (t.awaiting) { App.decideAttack(hero.id, ""); }
  else if (t.choice) { App.encounterChoice(hero.id, t.choice.options[0].id); }
  else break;
  t = race.legState.cars[hero.id].turn;
}
check("Leg 1 attackedThisLeg stays false (no attack ever resolved)", race.legState.cars[hero.id].attackedThisLeg === false);

// Leg 2: same setup but legIndex advanced -- attack SHOULD be offered.
setup();
race = STATE.race;
hero = race.participants[0];
race.legIndex = 1;
const rival2 = { ...hero, id: "rv2", name: "Rival2", type: "npc", out: false, lane: hero.lane, hexPos: hero.hexPos + 1, history: [], cumulative: 0, laps: 0, gear: 0, pendingD: 0, hp: 10, maxHp: 10 };
race.participants.push(rival2);
race.legState.cars[rival2.id] = { gearChange: 0, slipsThisLeg: 0, pendingD: 0, turn: null, turnDone: true };
race.legState.order.push(rival2.id);
hero.gear = 1;
App.takeTurn(hero.id);
t = race.legState.cars[hero.id].turn;
check("an attack IS offered on Leg 2 with a racer in range", t && t.awaiting && t.awaiting.length > 0);

document.getElementById("testresult").textContent = lines.join("\n") + "\n\n" + (lines.every(l => l.startsWith("PASS")) ? "ALL PASS" : "SOME FAILED");
} catch (e) { document.getElementById("testresult").textContent = "THREW: " + e.message + "\n" + e.stack; }
</script>
</body></html>
