<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="view"></div>
<pre id="testresult">pending</pre>
<script src="file:///D:/Dropbox/Home/Games/GASCAR/webapp/version.js"></script>
<script src="file:///D:/Dropbox/Home/Games/GASCAR/webapp/data.js"></script>
<script src="file:///D:/Dropbox/Home/Games/GASCAR/webapp/app.js"></script>
<script>
try {
const lines = []; function check(n, c) { lines.push((c ? "PASS" : "FAIL") + " - " + n); }
window.alert = () => {}; window.confirm = () => true;
rollD = s => 1 + Math.floor(Math.random() * s);

function setup() {
  STATE.shipClasses = []; STATE.crewmen = []; STATE.ships = []; STATE.courses = []; STATE.race = null;
  App.setShipyardAddDivision("Comet"); App.addShipClass(); const cls = STATE.shipClasses[0]; cls.thrust = 3; cls.damageControl = 2;
  App.addCrewman(); const c = STATE.crewmen[0]; c.pilot = 7; c.gunner = 5;
  App.addShip(); const sh = STATE.ships[0]; App.updateShip(sh.id, "classId", cls.id); App.updateShip(sh.id, "crewmanId", c.id); App.updateShip(sh.id, "name", "Mean Ghost");
  STATE.courses.push({ id: "c1", name: "T", division: "Comet", lanes: 6, innerHexes: 50, laps: 9, legMode: "tier", flatDamage: false });
  STATE._raceSetupCourse = "c1"; STATE._raceSetupShips = [sh.id]; STATE._draftNpcs = [];
  App.beginRace(); App.startRaceNow(); if (STATE.race) STATE.race.asteroids = [];
  return STATE.race;
}

// Full HP: no checkbox, ring present before turn
{
  const race = setup();
  const hero = race.participants[0];
  CURRENT_TAB = "race"; render();
  const html = document.getElementById("view").innerHTML;
  check("full HP: Damage Control checkbox is hidden", html.indexOf("Dmg Ctrl") === -1);
  check("full HP, pre-turn: hero icon has the active-turn ring", document.querySelector(`#circracer-${hero.id}`).classList.contains("active-turn"));
  check("full HP, pre-turn: a circracer-ring element is drawn", !!document.querySelector(`#circracer-${hero.id} .circracer-ring`));
}

// Damaged: checkbox shows pre-turn; ring disappears once the turn starts (move prompt)
{
  const race = setup();
  const hero = race.participants[0];
  hero.hp = 6;
  CURRENT_TAB = "race"; render();
  let html = document.getElementById("view").innerHTML;
  check("damaged, pre-turn: Damage Control checkbox is shown", html.indexOf("Dmg Ctrl") !== -1);
  check("damaged, pre-turn: hero icon has the active-turn ring", document.querySelector(`#circracer-${hero.id}`).classList.contains("active-turn"));
  App.takeTurn(hero.id);
  render();
  html = document.getElementById("view").innerHTML;
  const g = document.querySelector(`#circracer-${hero.id}`);
  check("mid-move (choice/awaiting active): ring is gone", !g.classList.contains("active-turn"));
  check("mid-move: no circracer-ring element drawn", !document.querySelector(`#circracer-${hero.id} .circracer-ring`));
}

document.getElementById("testresult").textContent = lines.join("\n") + "\n\n" + (lines.every(l => l.startsWith("PASS")) ? "ALL PASS" : "SOME FAILED");
} catch (e) { document.getElementById("testresult").textContent = "THREW: " + e.message + "\n" + e.stack; }
</script>
</body></html>
